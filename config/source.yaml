# =============================================================================
#  Источник СИ ВЭПП-3, станция LIGA (канал №0).
#  Формат параметра: {value, status, source, note}; статусы — docs/assumptions_and_uncertainties.md
# =============================================================================
source:
  electron_energy_GeV:
    value: 2.0
    status: document
    source: "Диссертация Гольденберга, табл. 2 (с. 60); техзадания «К-расчёту-профиля…»"
  field_T:
    value: 2.0
    status: document
    source: "Диссертация, табл. 2: H = 20 кГс (основной полюс трёхполюсного вигглера)"
  current_reference_mA:
    value: 100.0
    status: document
    source: "Диссертация, с. 61: оценки режимов проводились для I = 100 мА (рабочий диапазон 50–130 мА)"
  distance_m:
    value: 20.3
    status: experimental
    source: "Техзадания: «расстояние до источника излучения 20,3 м»"
    note: "Точка отсчёта (до мембраны, шаблона или ПММА) не указана; различие ~0.5 м меняет поток на ~5% (1/L для усреднённого сканированием потока)."
  source_size_v_mm:
    value: 0.5
    status: document
    source: "Диссертация, с. 61: «вертикальный — 0.5 мм»"
    note: "Не указано, σ это или полный размер. В модели трактуется как полный размер (FWHM → σ = 0.5/2.355). Влияние на угол < 0.02 мрад — пренебрежимо."
  source_size_h_mm:
    value: 2.0
    status: document
    source: "Диссертация, с. 61: «горизонтальный — 2 мм»"
    note: "Трактуется как FWHM (assumption), σ = 0.85 мм; на расстоянии 20.3 м даёт угловое размытие ~0.04 мрад."
  electron_divergence_mrad:
    value: 0.09
    status: document
    source: "Диссертация, с. 61: угловой разброс электронов в точке излучения ϑe = 0.09 мрад"
    note: "Трактуется как σ (assumption). При сканировании с амплитудой > ширины пучка на дозу не влияет (диссертация, с. 61)."
  channel_aperture_mrad:
    value: null
    status: unknown
    source: "Диссертация, с. 63: канал №0 «ограничен углом ±0,35 мрад»"
    note: "Направление ограничения не указано. Горизонтальный размер пучка 72 мм на 20 м (±1.8 мрад) противоречит горизонтальному ограничению ±0.35 мрад; вертикальное ±0.35 мрад × 20.3 м = ±7.1 мм согласуется с высотой пучка ~12–14 мм. По умолчанию ограничение НЕ применяется; вариант 'vertical_0p35' — в анализе чувствительности."
  beam_size_v_mm:
    value: 12.0
    status: document
    source: "Диссертация, табл. 2: макс. размер пучка СИ 12 мм × 72 мм"
  beam_size_h_mm:
    value: 72.0
    status: document
    source: "Диссертация, табл. 2"
  scan_half_amplitude_mm:
    value: 15.0
    status: experimental
    source: "Техзадания: «амплитуда сканирования вверх 15 мм от плоскости орбиты и вниз 15 мм»"
  scan_mode:
    value: averaged
    status: assumption
    source: "Диссертация, с. 67–68: вариант I — сборка шаблон+подложка качается поперёк пучка на расстояние больше ширины пучка"
    note: "Предполагаем равномерную скорость (треугольный закон) — доза пропорциональна интегралу потока по вертикали. Альтернатива 'explicit' проверяет то же явным розыгрышем положения."
  be_windows:
    total_um:
      value: 500
      status: experimental
      source: "Техзадания: «в самом начале канала бериллиевая фольга толщиной 500 мкм»; диссертация: 100+100+300 мкм"
    split_um:
      value: [100, 100, 300]
      status: document
      source: "Диссертация, с. 54–55"
    treatment:
      value: analytic
      status: assumption
      note: "Окна в начале канала (≥ 10 м до образца для 100+100 мкм; 300 мкм — входное окно камеры). Рассеянные в них фотоны практически не попадают в локальную область; явное моделирование — в validate (be_windows_explicit)."

spectrum:
  e_min_keV:
    value: 1.0
    status: assumption
    source: "ТЗ п. 2.2: начальный диапазон 1–80 кэВ; сходимость проверяется (liga spectrum)"
  e_max_keV:
    value: 80.0
    status: assumption
  e_step_keV:
    value: 0.1
    status: assumption
    note: "Сходимость по шагу проверяется сравнением с шагом 0.05 кэВ (validate: spectrum_convergence)"
  psi_step_mrad:
    value: 0.02
    status: assumption
  psi_max_mrad:
    value: 1.5
    status: assumption
    note: "Для E ≥ 1 кэВ доля потока за |ψ| > 1.5 мрад < 1e-4 (проверяется)"
